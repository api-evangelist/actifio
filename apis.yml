aid: actifio
name: Actifio
description: Actifio is an enterprise data management company that pioneered "copy data management" (CDM)
  built on its Virtual Data Pipeline (VDP) technology, letting organizations capture a single physical
  copy of production data and instantly provision virtual copies for backup, disaster recovery, business
  continuity, test/dev, and analytics. Founded in 2009 and headquartered in Waltham, Massachusetts, Actifio
  was acquired by Google Cloud in December 2020. Its technology now underpins the Google Cloud Backup
  and Disaster Recovery (Backup and DR) service and Actifio GO, delivering SaaS backup and DR for Google
  Cloud and hybrid workloads. Actifio VDP exposes automation via a RESTful API and CLI on the appliance,
  but there is no public developer portal, OpenAPI/Swagger specification, or published client SDK.
